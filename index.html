<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Hacker Website</title>

<style>
body {
  background: #050505;
  color: #00ff66;
  font-family: monospace;
  text-align: center;
  padding: 20px;
}
.box {
  border: 2px solid #00ff66;
  padding: 20px;
  margin-top: 40px;
  border-radius: 12px;
  box-shadow: 0 0 15px #00ff66;
}
h1 {
  text-shadow: 0 0 10px #00ff66;
}
button {
  background: #00ff66;
  color: black;
  padding: 12px 20px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="box">
<h1>WELCOME, HACKER! 💻</h1>
<p>नमस्ते! 👋 मेरी वेबसाइट में आपका स्वागत है।</p>
<p id="status">SYSTEM STATUS: ONLINE 🟢</p>
<button onclick="showMessage()">CLICK ME</button>
<p id="message"></p>
</div>

<script>
function showMessage() {
  document.getElementById("message").innerText =
  "Hello Hacker! Website successfully working! 🚀";
}
</script>
</body>
</html>
