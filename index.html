<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Virtual Mouse</title>

<style>
body {
    background: #171717;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

#screen {
    height: 350px;
    border: 2px solid white;
    margin: 20px;
    position: relative;
    background: #222;
    overflow: hidden;
    touch-action: none;
}

#cursor {
    width: 20px;
    height: 20px;
    background: #00ff88;
    border-radius: 50%;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

button {
    padding: 15px 25px;
    margin: 8px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}
</style>
</head>

<body>

<h2>🖱️ My Virtual Mouse</h2>
<p>अपनी उँगली से माउस चलाएँ</p>

<div id="screen">
    <div id="cursor"></div>
</div>

<button onclick="clickMouse('Left')">Left Click</button>
<button onclick="clickMouse('Right')">Right Click</button>

<p id="status">Mouse Ready</p>

<script>
const screen = document.getElementById("screen");
const cursor = document.getElementById("cursor");
const status = document.getElementById("status");

screen.addEventListener("pointermove", function(event) {
    const rect = screen.getBoundingClientRect();

    let x = event.clientX - rect.left;
    let y = event.clientY - rect.top;

    cursor.style.left = x + "px";
    cursor.style.top = y + "px";
});

function clickMouse(type) {
    status.textContent = type + " Click!";
}
</script>

</body>
</html>
