<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hacker Login</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #020805;
  color: #00ff66;
  font-family: monospace;
}
.login-box {
  width: 80%;
  max-width: 320px;
  padding: 25px;
  border: 1px solid #00ff66;
  border-radius: 12px;
  box-shadow: 0 0 20px #00ff6655;
  text-align: center;
}
input {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  background: #07130b;
  color: #00ff66;
  border: 1px solid #00ff66;
  border-radius: 5px;
}
button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  background: #00ff66;
  color: #001a08;
  border: 0;
  border-radius: 5px;
  font-weight: bold;
}
</style>
</head>
<body>
<div class="login-box">
  <h1>LOGIN 🔐</h1>
  <p>WELCOME, HACKER</p>
  <form id="loginForm">
    <input type="text" placeholder="Username" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">LOGIN</button>
  </form>
  <p id="message"></p>
  <small>DEMO LOGIN PAGE</small>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
  event.preventDefault();
  document.getElementById("message").textContent =
    "Demo only! Login is not connected.";
});
</script>
</body>
</html>
